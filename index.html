  <link rel="preload" href="fonts/baloo2-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/nunito-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="vendor/motion.js" defer></script>
  <script>
    // Hide what Motion brings in only when JS runs and motion is welcome, so the
    // page is complete without either. If Motion never runs, show everything.
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('intro');
      setTimeout(() => { if (!window.__introPlayed) document.documentElement.classList.remove('intro'); }, 3000);
    }
  </script>
  <style>
    /* Baloo 2 and Nunito Sans (SIL OFL 1.1, fonts/OFL-*.txt), Latin subset, copied from the app. */
    @font-face {
      font-family: 'Baloo 2';
      font-style: normal;
      font-weight: 700 800;
      font-display: swap;
      src: url(fonts/baloo2-latin.woff2) format('woff2');
    }
    @font-face {
      font-family: 'Nunito Sans';
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url(fonts/nunito-sans-latin.woff2) format('woff2');
    }

    /* Values copied from the app's built theme (packages/tokens/dist/theme.css). */
    :root {
      --bg: #F8FAFC;
      --text: #171B22;
      --muted: #656C7B;
      --primary: #376FDD;
      --ink: #235BC9;
      --soft: #D9E5FF;
      --border: #E2E6EE;
      --heading: 'Baloo 2', system-ui, sans-serif;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0F1117;
        --text: #F8FAFC;
        --muted: #A4ABBA;
        --primary: #628CDF;
        --ink: #82ABFF;
        --soft: rgba(81, 137, 250, 0.2);
        --border: #2A2F3A;
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 17px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--ink); }
    a:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; border-radius: 4px; }

    .wordmark {
      font-family: var(--heading);
      font-size: 26px;
      font-weight: 700;
      line-height: 1;
      color: var(--ink);
      text-decoration: none;
    }
    .wordmark b { font-weight: 800; }

    header { padding: 24px; display: flex; justify-content: center; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      text-align: center;
    }
    .flo { width: auto; height: clamp(120px, 24svh, 220px); margin-bottom: 20px; }
    .soon {
      margin: 0 0 14px;
      padding: 4px 14px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--ink);
      font-family: var(--heading);
      font-size: 15px;
      font-weight: 700;
    }
    h1 {
      margin: 0;
      font-family: var(--heading);
      font-size: clamp(34px, 5.4vw, 60px);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.01em;
      text-wrap: balance;
    }
    h1 .line { display: block; }
    h1 .line + .line { color: var(--primary); }
    h1 .w { display: inline-block; }
    .lead {
      max-width: 34em;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 1.6vw, 19px);
      text-wrap: balance;
    }

    /* The cheering crowd: one layer behind the page, each duck placed by its own
       --x/--y/--h (desktop) and --mx/--my/--mh (phones), tilted by --r, mirrored by .flip. */
    header, main, footer { position: relative; z-index: 1; }
    .crowd { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .duck {
      position: absolute;
      left: var(--x);
      top: var(--y);
      height: var(--h);
      width: auto;
      rotate: var(--r, 0deg);
      translate: calc(var(--px, 0) * var(--z, 1) * 1px) calc(var(--py, 0) * var(--z, 1) * 1px);
    }
    .duck.flip { scale: -1 1; }
    /* Short laptop screens: the two front-centre ducks duck down out of the text's way. */
    @media (min-width: 701px) and (max-height: 800px) { .duck.low { top: 85%; height: 9vh; } }
    @media (max-width: 700px) {
      .duck { left: var(--mx); top: var(--my); height: var(--mh); }
      .duck:not([style*="--mx"]) { display: none; }
    }

    footer {
      padding: 24px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    /* Starting state for the intro (the head script sets .intro; Motion takes over from here). */
    .intro .flo, .intro .soon, .intro h1 .w, .intro .lead, .intro .duck, .intro header, .intro footer { opacity: 0; }
    .flo.tappable { cursor: pointer; -webkit-tap-highlight-color: transparent; }

    /* Short screens (small phones, landscape): shrink Flo so it all still fits one screen. */
    @media (max-height: 700px) {
      .flo { height: clamp(80px, 18svh, 140px); margin-bottom: 12px; }
      header { padding: 16px 24px; }
      footer { padding: 16px 24px; }
      .lead { margin-top: 12px; }
    }
    @media (max-height: 480px) {
      .flo, .soon, .crowd { display: none; }
      h1 { font-size: 30px; }
    }
  </style>
</head>
<body>
  <div class="crowd" aria-hidden="true">
    <img class="duck" src="crowd/flo-1.webp" alt="" style="--x:3%;--y:9%;--h:13vh;--r:-8deg;--b:1.3s;--mx:4%;--my:8%;--mh:8svh">
    <img class="duck flip" src="crowd/flo-5.webp" alt="" style="--x:13%;--y:27%;--h:11vh;--r:5deg;--b:1.6s">
    <img class="duck" src="crowd/flo-3.webp" alt="" style="--x:2%;--y:41%;--h:17vh;--r:-4deg;--b:1.2s">
    <img class="duck flip" src="crowd/flo-2.webp" alt="" style="--x:8%;--y:57%;--h:13vh;--r:6deg;--b:1.5s">
    <img class="duck" src="crowd/flo-4.webp" alt="" style="--x:1%;--y:72%;--h:21vh;--r:-3deg;--b:1.35s;--mx:-6%;--my:79%;--mh:12svh">
    <img class="duck flip" src="crowd/flo-6.webp" alt="" style="--x:17%;--y:80%;--h:15vh;--r:4deg;--b:1.7s;--mx:17%;--my:81%;--mh:10svh">

    <img class="duck flip" src="crowd/flo-1.webp" alt="" style="--x:87%;--y:8%;--h:13vh;--r:8deg;--b:1.45s;--mx:76%;--my:8%;--mh:8svh">
    <img class="duck" src="crowd/flo-6.webp" alt="" style="--x:79%;--y:26%;--h:11vh;--r:-5deg;--b:1.25s">
    <img class="duck flip" src="crowd/flo-3.webp" alt="" style="--x:86%;--y:40%;--h:17vh;--r:4deg;--b:1.55s">
    <img class="duck" src="crowd/flo-2.webp" alt="" style="--x:85%;--y:57%;--h:13vh;--r:-6deg;--b:1.3s">
    <img class="duck flip" src="crowd/flo-4.webp" alt="" style="--x:85%;--y:71%;--h:21vh;--r:3deg;--b:1.6s;--mx:76%;--my:79%;--mh:12svh">
    <img class="duck" src="crowd/flo-5.webp" alt="" style="--x:71%;--y:81%;--h:14vh;--r:-4deg;--b:1.4s;--mx:58%;--my:81%;--mh:10svh">

    <img class="duck low" src="crowd/flo-3.webp" alt="" style="--x:31%;--y:81%;--h:11vh;--r:-5deg;--b:1.5s;--mx:38%;--my:82%;--mh:9svh">
    <img class="duck flip low" src="crowd/flo-1.webp" alt="" style="--x:64%;--y:81%;--h:11vh;--r:5deg;--b:1.25s">
  </div>

  <header>
    <a class="wordmark" href="/" aria-label="FluentStrides home"><b>Fluent</b>Strides</a>
  </header>

  <main>
    <img class="flo" src="flo.svg" alt="Flo, the FluentStrides duck" width="476" height="621">
    <p class="soon">Coming soon</p>
    <h1><span class="line"><span class="w">Stop</span> <span class="w">playing</span> <span class="w">language</span> <span class="w">games.</span></span> <span class="line"><span class="w">Start</span> <span class="w">understanding.</span></span></h1>
    <p class="lead">Watch real videos at exactly your level and pick up a language by understanding people talk.</p>
  </main>

  <footer>A <a href="https://webstrides.com">WebStrides</a> product &middot; &copy; 2026 WebStrides LLC</footer>

  <script type="module">
    // vendor/motion.js is Motion 12.43.0's standalone build (MIT, vendor/MOTION-LICENSE.md);
    // it's deferred, so it has run before this module does.
    const { animate, stagger } = window.Motion ?? {};
    const root = document.documentElement;

    if (animate && root.classList.contains('intro')) {
      window.__introPlayed = true;
      const flo = document.querySelector('.flo');
      const words = document.querySelectorAll('h1 .w');
      const ducks = [...document.querySelectorAll('.duck')].filter((d) => d.offsetWidth);
      const spring = { type: 'spring', stiffness: 260, damping: 18 };

      // Flo lands first, with a little squash; then the words rise in reading order.
      animate('header', { opacity: [0, 1] }, { duration: 0.6 });
      animate(flo, { opacity: [0, 1], y: [40, 0], scale: [0.85, 1] }, { ...spring, delay: 0.1 });
      animate('.soon', { opacity: [0, 1], y: [10, 0], scale: [0.9, 1] }, { ...spring, delay: 0.35 });
      animate(words, { opacity: [0, 1], y: ['0.5em', 0], filter: ['blur(6px)', 'blur(0px)'] },
        { duration: 0.55, delay: stagger(0.06, { startDelay: 0.42 }), ease: [0.2, 0, 0, 1] });
      animate('.lead', { opacity: [0, 1], y: [12, 0] }, { duration: 0.6, delay: 0.85, ease: [0.2, 0, 0, 1] });
      animate('footer', { opacity: [0, 1] }, { duration: 0.6, delay: 1.1 });

      // The crowd pops up from the centre outwards, then each duck bobs on its own beat.
      const cx = innerWidth / 2, cy = innerHeight / 2;
      const far = Math.hypot(cx, cy);
      for (const duck of ducks) {
        const r = duck.getBoundingClientRect();
        const dist = Math.hypot(r.left + r.width / 2 - cx, r.top + r.height / 2 - cy) / far;
        // Bigger ducks are nearer, so they move further with the pointer.
        duck.style.setProperty('--z', (r.height / (innerHeight * 0.14)).toFixed(2));
        const bob = parseFloat(getComputedStyle(duck).getPropertyValue('--b')) || 1.4;
        animate(duck, { opacity: [0, 1], y: ['40%', '0%'], scale: [0.6, 1] },
          { type: 'spring', stiffness: 300, damping: 16, delay: 0.55 + dist * 0.5 })
          .then(() => animate(duck, { y: ['0%', '-7%'] },
            { duration: bob, ease: 'easeInOut', repeat: Infinity, repeatType: 'reverse' }));
      }

      // The crowd leans gently toward the pointer (mouse and trackpad only).
      if (matchMedia('(pointer: fine)').matches) {
        const crowd = document.querySelector('.crowd');
        addEventListener('pointermove', (e) => {
          animate(crowd, {
            '--px': ((e.clientX / innerWidth) - 0.5) * -16,
            '--py': ((e.clientY / innerHeight) - 0.5) * -10,
          }, { type: 'spring', stiffness: 60, damping: 18 });
        }, { passive: true });
      }

      // Tap Flo: he hops, and the crowd cheers back in a ripple out from him.
      flo.classList.add('tappable');
      flo.addEventListener('click', () => {
        animate(flo, { y: [0, -28, 0], rotate: [0, -6, 6, 0], scale: [1, 1.04, 1] }, { duration: 0.6, ease: 'easeOut' });
        const f = flo.getBoundingClientRect();
        for (const duck of ducks) {
          const r = duck.getBoundingClientRect();
          const dist = Math.hypot(r.left - f.left, r.top - f.top) / far;
          animate(duck, { scale: [1, 1.18, 1] }, { duration: 0.45, delay: 0.15 + dist * 0.35, ease: 'easeOut' });
        }
      });
    }
  </script>
</body>
</html>
